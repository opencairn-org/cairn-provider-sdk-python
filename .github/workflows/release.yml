name: release

# A v* tag publishes the GitHub release: the tag's CHANGELOG.md section as
# notes, with the wheel and sdist (built by `make build` after the full check,
# which includes `griffe check` against the previous tag) as assets, their
# checksums signed keyless with cosign, a GitHub provenance attestation and an
# SPDX SBOM. No PyPI publish: workers depend on the release tag or the git
# source until the package is published.
#
# Releases are immutable org-wide (a published release reserves its tag
# forever), so the check runs first and a failed build never leaves one behind.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never abandon a release halfway through

permissions:
  contents: read

jobs:
  # Unprivileged gate: the full check passes, and the tag is on main.
  verify:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false     # a publishing run does not read caches other runs wrote
      - run: uv python install
      - name: gitleaks, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the tag is on main, the version matches, and the check passes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
          grep -q "^version = \"${TAG#v}\"" pyproject.toml || { echo "pyproject.toml version is not ${TAG#v}"; exit 1; }
          make tools
          export PATH="$(go env GOPATH)/bin:$PATH"
          make check
          (cd dist && sha256sum -- * > checksums.txt)
      - name: Upload the build (wheel + sdist + checksums from `make build`)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: write       # create the release
      id-token: write       # keyless cosign and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Verify the checksums of the downloaded build
        run: cd dist && sha256sum -c checksums.txt

      # Keyless sigstore signature over the checksum file: one bundle covers every asset.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      # GitHub-native provenance attestation (Attestations tab, `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: SBOM of the wheel (SPDX JSON)
        id: names
        run: echo "wheel=$(cd dist && ls -- *.whl)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/${{ steps.names.outputs.wheel }}
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          WHEEL: ${{ steps.names.outputs.wheel }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          # the tag's section without its heading, blank lines around it trimmed
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md \
            | sed -e '1{/^$/d}' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## [$v]' section"; exit 1; }
          cat >> notes.md <<EOF

          ### Install

          ~~~
          uv add "cairn-provider-sdk @ https://github.com/${REPO}/releases/download/${TAG}/${WHEEL}"
          ~~~

          The wheel and sdist are the ones \`make build\` produced in the verifying run.
          \`checksums.txt\` is signed keyless with cosign (\`checksums.txt.sigstore.json\`), the
          build is attested by GitHub Actions and the attached SPDX file is the wheel's SBOM. Verify with

          ~~~
          cosign verify-blob --bundle checksums.txt.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/${REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          gh attestation verify ${WHEEL} --repo ${REPO}
          ~~~
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086  # $pre is an optional flag
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre dist/*
